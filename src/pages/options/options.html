<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>CC98 AI+ 设置</title>
  <style>
    :root {
      --pri:#245d70; --pri-h:#1b4a5a; --pri-fill:#245d70; --pri-fill-h:#1b4a5a;
      --pri-soft:#eef8fb; --pri-bd:#b8d5de; --on-pri:#fff;
      --bg:#eef4f7; --card:#fff; --bd:#dfeaef; --bd-soft:#edf4f7;
      --txt:#1a2b33; --txt2:#485e6a; --txt3:#5d7681;
      --err:#b42318; --err-bg:#fef4f3; --err-bd:#f3ccc7; --ok:#287046;
      --sh:0 1px 3px rgba(20,50,62,.06);
      color-scheme:light;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --pri:#6fbdd6; --pri-h:#8ed0e5; --pri-fill:#2f7188; --pri-fill-h:#3a8299;
        --pri-soft:#162b34; --pri-bd:#2d4c58; --on-pri:#f0f9fc;
        --bg:#0b1317; --card:#101a1f; --bd:#25383f; --bd-soft:#1c2c33;
        --txt:#e6eef2; --txt2:#9fb3bd; --txt3:#7d939e;
        --err:#f2938a; --err-bg:#2a1614; --err-bd:#4a2521; --ok:#6cc48c;
        --sh:0 1px 3px rgba(0,0,0,.4);
        color-scheme:dark;
      }
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
    .wrap{max-width:760px;margin:0 auto;padding:36px 24px 80px}
    h1{font-size:22px;font-weight:650;margin:0 0 5px;letter-spacing:.2px}
    .sub{font-size:13px;color:var(--txt2);margin-bottom:26px}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--sh)}
    .card h2{font-size:14px;font-weight:650;margin:0 0 4px;letter-spacing:.2px}
    .card-sub{font-size:12px;color:var(--txt3);margin:0 0 18px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;font-weight:650;color:var(--txt2);margin-bottom:6px;letter-spacing:.3px}
    .field input,.field select{width:100%;padding:10px 13px;border:1px solid var(--bd);border-radius:9px;font-size:13px;font-family:inherit;color:var(--txt);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
    .field input::placeholder{color:var(--txt3)}
    .field input:hover,.field select:hover{border-color:var(--pri-bd)}
    .field input:focus,.field select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
    .field input[readonly]{background:var(--bg);color:var(--txt2);cursor:default}
    .field input[type=range]{padding:0;border:none;background:none;accent-color:var(--pri);height:20px;cursor:pointer}
    .field input[type=range]:focus{box-shadow:none}
    .row{display:flex;gap:14px}
    .row .field{flex:1;min-width:0}
    .range-val{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}
    .input-action{display:flex;gap:8px}
    .input-action input{flex:1;min-width:0}
    .input-action .btn{padding-left:14px;padding-right:14px;white-space:nowrap}
    .btn{border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn-primary{background:var(--pri-fill);color:var(--on-pri)}
    .btn-primary:hover:not(:disabled){background:var(--pri-fill-h)}
    .btn-ghost{background:var(--card);color:var(--txt);border:1px solid var(--bd)}
    .btn-ghost:hover:not(:disabled){background:var(--pri-soft);border-color:var(--pri-bd);color:var(--pri)}
    .btn-danger{background:var(--card);color:var(--err);border:1px solid var(--err-bd)}
    .btn-danger:hover:not(:disabled){background:var(--err-bg)}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
    .status{font-size:12px;font-weight:500;color:var(--ok)}
    .status.error{color:var(--err)}
    .status.pending{color:var(--txt2)}
    .hint{font-size:12px;color:var(--txt2);line-height:1.65;margin-top:6px}
    [hidden]{display:none!important}
    @media (max-width:620px){.row{display:block}.wrap{padding:20px 14px 60px}.card{padding:18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CC98 AI+ 设置</h1>
    <div class="sub">先连接一个 AI 服务，再按需要调整搜索范围。订阅登录和通知渠道在 CC98 页面内的插件面板中设置。</div>

    <div class="card">
      <h2>AI 服务</h2>
      <div class="card-sub">选择服务商会自动填写推荐地址和模型；API Key 只保存在这台浏览器中。</div>

      <div class="row">
        <div class="field">
          <label for="service">服务商</label>
          <select id="service">
            <option value="siliconflow">硅基流动</option>
            <option value="deepseek">DeepSeek</option>
            <option value="zhipu">智谱 AI</option>
            <option value="dashscope">阿里百炼</option>
            <option value="custom">自定义兼容服务</option>
          </select>
        </div>
        <div class="field" id="customProtocolField" hidden>
          <label for="provider">接口协议</label>
          <select id="provider">
            <option value="openai">OpenAI 兼容</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="apiKey">API Key</label>
        <div class="input-action">
          <input id="apiKey" type="password" placeholder="粘贴服务商提供的 API Key" autocomplete="off" spellcheck="false" />
          <button class="btn btn-ghost" id="toggleApiKey" type="button" aria-pressed="false">显示</button>
        </div>
        <div class="hint">Key 不会发送给 CC98 或订阅后端，只会发往下方显示的 AI 服务地址。</div>
      </div>

      <div class="row">
        <div class="field">
          <label for="model">模型</label>
          <input id="model" type="text" placeholder="Qwen/Qwen2.5-14B-Instruct" spellcheck="false" />
        </div>
        <div class="field">
          <label for="baseUrl">API 地址</label>
          <input id="baseUrl" type="url" placeholder="https://api.example.com/v1" spellcheck="false" />
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="saveLLM" type="button">保存 AI 配置</button>
        <button class="btn btn-ghost" id="testLLM" type="button">测试当前填写</button>
        <button class="btn btn-danger" id="resetLLM" type="button">清除并恢复默认</button>
        <span class="status" id="llmStatus" aria-live="polite"></span>
      </div>
    </div>

    <div class="card">
      <h2>搜索范围</h2>
      <div class="card-sub">范围越大，搜索越全面，但耗时和 AI 用量也会增加。</div>
      <div class="row">
        <div class="field">
          <label>关键词数（<span class="range-val" id="keywordCountVal">4</span>）</label>
          <input id="keywordCount" type="range" min="1" max="10" step="1" />
        </div>
        <div class="field">
          <label>每词搜索结果（<span class="range-val" id="searchLimitPerKeywordVal">20</span>）</label>
          <input id="searchLimitPerKeyword" type="range" min="5" max="50" step="5" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>选取主题数（<span class="range-val" id="topicLimitVal">10</span>）</label>
          <input id="topicLimit" type="range" min="3" max="20" step="1" />
        </div>
        <div class="field">
          <label>每主题最多读回复（<span class="range-val" id="maxRepliesPerTopicVal">30</span>）</label>
          <input id="maxRepliesPerTopic" type="range" min="5" max="60" step="5" />
        </div>
      </div>
      <div class="field">
        <label>每楼截断字数（<span class="range-val" id="maxCharsPerReplyVal">1000</span>）</label>
        <input id="maxCharsPerReply" type="range" min="200" max="2000" step="100" />
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="saveBudget" type="button">保存搜索范围</button>
        <button class="btn btn-danger" id="resetBudget" type="button">恢复默认</button>
        <span class="status" id="budgetStatus" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
